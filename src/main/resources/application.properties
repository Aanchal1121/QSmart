# ===================================================================
# QSmart - Application Configuration
# ===================================================================

server.port=8080
spring.application.name=QSmart-Virtual-Queue-System

# Database Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/qsmart_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Aanchal@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/

# SMS Provider Configuration
qsmart.sms.mock=true
qsmart.sms.provider=mock
qsmart.sms.sender-id=QSMART

# Queue Configuration
qsmart.queue.default-service-duration=10
qsmart.queue.grace-period-minutes=5
qsmart.queue.auto-call-buffer=2

# Logging Configuration
logging.level.com.qsmart=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
