<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSmart — Patient Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-intersect"></i> QSmart
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-house me-1"></i>Home</a>
                <a href="login.html" class="btn btn-light btn-sm"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="custom-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 bg-primary-subtle text-primary rounded-circle mb-2">
                            <i class="bi bi-person-plus-fill fs-2"></i>
                        </div>
                        <h4 class="fw-bold text-dark">Create Patient Account</h4>
                        <p class="text-muted small">Register to book tokens and monitor live waiting queues</p>
                    </div>

                    <div id="regAlert" class="alert d-none" role="alert"></div>

                    <form id="regForm" onsubmit="handleRegister(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Full Name *</label>
                            <input type="text" id="regName" class="form-control" placeholder="e.g. Ramesh Chandra" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Mobile Number *</label>
                                <input type="tel" id="regPhone" class="form-control" placeholder="+919876543210" required>
                                <div class="form-text">SMS alerts will be sent to this number</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Email Address (Optional)</label>
                                <input type="email" id="regEmail" class="form-control" placeholder="name@example.com">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Create Password *</label>
                            <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" minlength="6" required>
                        </div>

                        <button type="submit" id="regBtn" class="btn btn-primary-teal w-100 py-2 fw-semibold">
                            <i class="bi bi-check2-circle me-1"></i> Complete Registration
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <small class="text-muted">Already registered? <a href="login.html" class="fw-semibold text-primary">Login here</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const alertBox = document.getElementById('regAlert');
            alertBox.classList.add('d-none');
            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

            const payload = {
                name: document.getElementById('regName').value.trim(),
                phone: document.getElementById('regPhone').value.trim(),
                email: document.getElementById('regEmail').value.trim() || null,
                password: document.getElementById('regPassword').value,
                role: 'ROLE_PATIENT'
            };

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await res.json();

                if (json.success) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Account created successfully! Redirecting to login...';
                    alertBox.classList.remove('d-none');
                    setTimeout(() => window.location.href = 'login.html', 1200);
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = json.message || 'Registration failed';
                    alertBox.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Complete Registration';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Server error: ' + err.message;
                alertBox.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Complete Registration';
            }
        }
    </script>
</body>
</html>
