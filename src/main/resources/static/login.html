<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSmart — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-intersect"></i> QSmart
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-house me-1"></i>Home</a>
                <a href="register.html" class="btn btn-light btn-sm"><i class="bi bi-person-plus me-1"></i>Register</a>
                <div class="dropdown">
                    <button class="btn lang-dropdown-btn dropdown-toggle" type="button" id="langDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-translate text-primary"></i> <span id="currentLangLabel">Language</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end dropdown-menu-lang" aria-labelledby="langDropdownBtn">
                        <li><button class="dropdown-item lang-item" data-lang="en" onclick="setLanguage('en')"><span>English</span> <small class="text-muted">EN</small></button></li>
                        <li><button class="dropdown-item lang-item" data-lang="hi" onclick="setLanguage('hi')"><span>हिंदी</span> <small class="text-muted">Hindi</small></button></li>
                        <li><button class="dropdown-item lang-item" data-lang="mr" onclick="setLanguage('mr')"><span>मराठी</span> <small class="text-muted">Marathi</small></button></li>
                        <li><button class="dropdown-item lang-item" data-lang="gu" onclick="setLanguage('gu')"><span>ગુજરાતી</span> <small class="text-muted">Gujarati</small></button></li>
                        <li><button class="dropdown-item lang-item" data-lang="bn" onclick="setLanguage('bn')"><span>বাংলা</span> <small class="text-muted">Bengali</small></button></li>
                        <li><button class="dropdown-item lang-item" data-lang="te" onclick="setLanguage('te')"><span>తెలుగు</span> <small class="text-muted">Telugu</small></button></li>
                        <li><button class="dropdown-item lang-item" data-lang="ta" onclick="setLanguage('ta')"><span>தமிழ்</span> <small class="text-muted">Tamil</small></button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="custom-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 bg-primary-subtle text-primary rounded-circle mb-2">
                            <i class="bi bi-shield-lock-fill fs-2"></i>
                        </div>
                        <h4 class="fw-bold text-dark">Welcome to QSmart</h4>
                        <p class="text-muted small">Sign in with your Email or Mobile Number</p>
                    </div>

                    <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email or Mobile Number</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" class="form-control" placeholder="e.g. patient.amit@qsmart.com or +919876500005" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" id="loginBtn" class="btn btn-primary-teal w-100 py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </form>

                    <!-- Quick 1-Click Demo Login Box -->
                    <div class="mt-4 pt-3 border-top">
                        <small class="text-muted fw-bold d-block mb-2 text-uppercase text-center">Quick 1-Click Demo Accounts</small>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-sm btn-outline-primary text-start" onclick="quickFill('patient.amit@qsmart.com', 'Patient@123')">
                                <i class="bi bi-person me-2"></i><strong>Patient:</strong> patient.amit@qsmart.com (Amit Kumar)
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-success text-start" onclick="quickFill('staff.rahul@qsmart.com', 'Staff@123')">
                                <i class="bi bi-person-badge me-2"></i><strong>Staff:</strong> staff.rahul@qsmart.com (Reception Desk)
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger text-start" onclick="quickFill('dr.sharma@qsmart.com', 'Doctor@123')">
                                <i class="bi bi-heart-pulse me-2"></i><strong>Doctor:</strong> dr.sharma@qsmart.com (MD OPD)
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary text-start" onclick="quickFill('admin@qsmart.com', 'Admin@123')">
                                <i class="bi bi-shield-lock me-2"></i><strong>Admin:</strong> admin@qsmart.com (System Admin)
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <small class="text-muted">Don't have an account? <a href="register.html" class="fw-semibold text-primary">Register here</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script src="js/voice-assistant.js"></script>

    <script>
        function quickFill(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }

        async function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('loginAlert');
            alertBox.classList.add('d-none');
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

            const payload = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await res.json();

                if (json.success && json.data) {
                    showToast('Login successful! Redirecting...', 'success');
                    const role = json.data.role;
                    setTimeout(() => {
                        if (role === 'ROLE_PATIENT') window.location.href = 'patient-dashboard.html';
                        else if (role === 'ROLE_STAFF') window.location.href = 'staff-dashboard.html';
                        else if (role === 'ROLE_DOCTOR') window.location.href = 'doctor-dashboard.html';
                        else if (role === 'ROLE_ADMIN') window.location.href = 'admin-dashboard.html';
                        else window.location.href = 'index.html';
                    }, 600);
                } else {
                    alertBox.textContent = json.message || 'Login failed. Please check your credentials.';
                    alertBox.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
                }
            } catch (err) {
                alertBox.textContent = 'Server connection error: ' + err.message;
                alertBox.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
            }
        }
    </script>
</body>
</html>
